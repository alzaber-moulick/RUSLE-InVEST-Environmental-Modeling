# RUSLE pipeline configuration - Bhasan Char (FINAL)
# Update the data/ paths below to match your local folder.

# --- DEM ---
# Only used if ls_factor_path is NOT given
dem_path: "data/bhasanchar_dem_copernicus.tif"
dem_cell_size_m: 30.0
slope_length_cap_m: 300.0

# --- LS-factor: already computed, use directly ---
#ls_factor_path: "data/bhasanchar_ls_factor.tif"

# --- R-factor: already computed, use directly ---
r_factor_path: "data/bhasanchar_r_factor.tif"

# --- K-factor: 4-band soil stack from extract_soil_data.py ---
# band order = ee.Image.cat([sand, silt, clay, organic_carbon])
soil_properties_path: "data/bhasanchar_soil_properties.tif"
soil_band_order: ["sand", "silt", "clay", "soc"]

# --- LULC / C-factor: one soil-loss map is produced per year listed here ---
# Only band 1 of each file is read (the classification band); no separate
# masking band is needed — verified against the GRASS r.report ground-truth
# area check (2020: computed areas matched the report to within 0.05 sq km).
lulc_path:
  2015: "data/clip2015.tif"
  2020: "data/clip2020.tif"
  2025: "data/clip2025.tif"

# Verified class codes (cross-checked against 2020_area.txt / GRASS r.report):
#   0 = Waterbody   1 = Bareland   2 = Builtup   3 = Vegetation
c_lookup:
  0: 0.0    # Waterbody
  1: 0.6    # Bareland
  2: 0.05   # Builtup
  3: 0.02   # Vegetation

# --- P-factor (optional; omit to assume P = 1 everywhere) ---
# p_path: "data/p_factor.tif"

# --- AOI boundary (optional; clips every output) ---
aoi_path: "data/Bhasanchar.shp"
